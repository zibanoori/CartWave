<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Leather Bag - CartWave</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <section class="py-5">
      <div class="container">
        <nav class="mb-4" aria-label="breadcrumb">
          <ol class="breadcrumb small text-muted">
            <li class="breadcrumb-item">
              <a href="/" class="text-decoration-none text-muted"></a>
            </li>
            <li class="breadcrumb-item">
              <a href="/shop/" class="text-decoration-none text-muted"></a>
            </li>
            <li class="breadcrumb-item active fw-semibold">
              Premium Leather Bag
            </li>
          </ol>
        </nav>

        <div class="row g-5 align-items-start">
          <div class="col-lg-6">
            <div
              class="bg-light rounded-4 overflow-hidden shadow-sm position-relative"
            >
              <img
                src="assets/images/baggg.webp"
                alt="Product"
                class="w-100 h-auto object-fit-cover"
                style="min-height: 500px"
              />
            </div>
            <div class="d-flex gap-2 mt-3">
              <div
                class="border border-light-subtle rounded-3 p-1"
                style="width: 70px; height: 70px"
              >
                <img
                  src="assets/images/bagg.webp"
                  alt="thumb"
                  class="w-100 h-100 object-fit-cover rounded-2"
                />
              </div>
            </div>
          </div>

          <div class="col-lg-6 ps-lg-5">
            <h1 class="display-6 fw-bold mb-3 text-dark">
              Premium Leather Bag
            </h1>
            <div
              class="d-flex align-items-baseline gap-3 mb-4 pb-3 border-bottom border-light-subtle"
            >
              <span class="fs-2 fw-bold text-success">$129.00</span>
              <div class="d-flex align-items-center text-warning small">
                <i class="bi bi-star-fill me-1"></i>
                <i class="bi bi-star-fill me-1"></i>
                <i class="bi bi-star-fill me-1"></i>
                <span class="fw-medium text-dark">4.5</span>
                <span class="text-muted ms-1">/5</span>
              </div>
            </div>
            <p class="text-muted mb-4 lh-lg" style="font-size: 1.05rem">
              This premium leather bag is crafted from the finest materials to
              provide both style and durability. Perfect for everyday use or
              special occasions.
            </p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
