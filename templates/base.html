{% load static humanize %}
<!doctype html>
<html lang="en" class="no-js" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}CartWave{% endblock %}</title>

    <meta name="description" content="{{ site_config.description }}" />

    {% if site_config.favicon %}
    <link rel="icon" type="image/png" href="{{ site_config.favicon.url }}" />
    {% endif %}

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sections.css' %}" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 text-decoration-none"
          href="/"
        >
          {% if site_config.logo %}
          <img
            src="{{ site_config.logo.url }}"
            alt="Logo"
            height="45"
            class="d-inline-block align-text-top"
          />
          {% else %}
          <span class="brand-name fw-bold text-success"
            >Cart<span class="text-dark">Wave</span></span
          >
          {% endif %}
        </a>
        
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/shop/">Shop</a></li>
          </ul>

          <div class="d-flex gap-3">
            <button
              class="btn btn-outline-secondary rounded-2 px-3 js-theme-toggle"
              aria-label="Toggle dark mode"
            >
              <i class="bi bi-moon-fill"></i>
            </button>
            <a href="#" class="btn btn-success rounded-2 px-4">Login</a>
          </div>
        </div>
      </div>
    </nav>

     <main>
        {% block content %}
        {% endblock %}
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
