<!doctype html>
<html lang="en" class="no-js" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CartWave</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/images/android-chrome-192x192.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/sections.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 text-decoration-none"
          href="javascript:void(0)"
        >
          <img
            src="./assets/images/favicon.ico"
            alt="CartWave Logo"
            width="45"
            height="45"
            class="d-inline-block align-text-top"
          />
          <span class="fw-bold fs-4" style="color: #e63946"
            >Cart<span style="color: #ff6b35">Wave</span></span
          >
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
            <li class="nav-item">
              <a class="nav-link active text-dark" href="javascript:void(0)"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="javascript:void(0)">Shop</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-dark"
                href="javascript:void(0)"
                role="button"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                Categories
              </a>
              <ul class="dropdown-menu border-0 shadow">
                <li>
                  <a class="dropdown-item" href="javascript:void(0)"
                    >Electronics</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="javascript:void(0)">Fashion</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="javascript:void(0)"
                    >Accessories</a
                  >
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="javascript:void(0)">About</a>
            </li>
          </ul>
          <div class="d-flex gap-3">
            <a
              href="javascript:void(0)"
              class="btn btn-outline-danger position-relative rounded-pill px-3"
              aria-label="Shopping cart with 2 items"
            >
              <i class="bi bi-cart" aria-hidden="true"></i>
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              >
                2
                <span class="visually-hidden">items in cart</span>
              </span>
            </a>
            <a
              href="javascript:void(0)"
              class="btn btn-danger rounded-pill px-4"
            >
              <i class="bi bi-person-fill me-2" aria-hidden="true"></i>
              Login
            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/script/main.js"></script>
  </body>
</html>
