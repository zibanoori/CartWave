<!doctype html>
<html lang="en" class="no-js" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - CartWave</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/sections.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 text-decoration-none"
          href="index.html"
        >
          <img
            src="./assets/images/logo5.webp"
            alt="CartWave Logo"
            width="45"
            height="45"
          />
          <span class="brand-name"
            >Cart<span class="brand-accent">Wave</span></span
          >
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
            <li class="nav-item">
              <a class="nav-link text-dark" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active text-dark" href="shop.html">Shop</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-dark"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                >Categories</a
              >
              <ul class="dropdown-menu border-0 shadow">
                <li>
                  <a class="dropdown-item" href="shop.html?category=electronics"
                    >Electronics</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="shop.html?category=fashion"
                    >Fashion</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="shop.html?category=accessories"
                    >Accessories</a
                  >
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#about">About</a>
            </li>
          </ul>

          <div class="d-lg-none mb-3">
            <h6 class="fw-bold text-muted mb-2">Categories</h6>
            <ul class="list-unstyled">
              <li>
                <a
                  href="shop.html?category=electronics"
                  class="text-decoration-none text-dark d-block py-1"
                  >Electronics</a
                >
              </li>
              <li>
                <a
                  href="shop.html?category=fashion"
                  class="text-decoration-none text-dark d-block py-1"
                  >Fashion</a
                >
              </li>
              <li>
                <a
                  href="shop.html?category=beauty"
                  class="text-decoration-none text-dark d-block py-1"
                  >Beauty & Perfume</a
                >
              </li>
            </ul>
          </div>

          <form
            class="d-flex me-3 position-relative"
            role="search"
            method="GET"
            action="shop.html"
          >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-search text-muted"></i>
              </span>
              <input
                type="search"
                name="q"
                placeholder="Search products..."
                aria-label="Search products"
              />
            </div>
          </form>
          <button
            class="btn btn-outline-secondary rounded-2 px-3 js-theme-toggle"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div class="d-flex gap-3">
            <a
              href="#"
              class="btn btn-outline-success position-relative rounded-2 px-3"
            >
              <i class="bi bi-cart"></i>
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success text-white"
              ></span>
            </a>
            <a href="#" class="btn btn-success rounded-2 px-4"
              ><i class="bi bi-person-fill me-2"></i>Login</a
            >
          </div>
        </div>
      </div>
    </nav>
    <!-- Shop Header -->
    <section class="py-5 bg-light text-center">
      <div class="container">
        <h1 class="fw-bold mb-3">All products</h1>
        <p class="text-muted">Discover our latest collection of permium item</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row g-4">
          <aside class="col-lg-3">
            <div class="card border-0 shadow-sm p-3">
              <h5 class="fw-bold mb-3">Filters</h5>
              <div class="mb-4">
                <h6 class="fw-semibold">Categories</h6>
                <ul class="list-unstyled">
                  <li>
                    <a href="#" class="text-decoration-none text-muted"
                      >Electronics</a
                    >
                  </li>
                  <li>
                    <a href="#" class="text-decoration-none text-muted"
                      >Fashion</a
                    >
                  </li>
                  <li>
                    <a href="#" class="text-decoration-none text-muted"
                      >Accessories</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </aside>

          <main class="col-lg-9">

          </main>

        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/script/main.js"></script>
  </body>
</html>
